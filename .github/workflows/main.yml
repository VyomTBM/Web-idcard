name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller bottle colorama
      - run: pyinstaller --onefile --console --name IdentityGenerator main.py
      - uses: actions/upload-artifact@v4
        with:
          name: IdentityGenerator-exe
          path: dist/IdentityGenerator.exe
